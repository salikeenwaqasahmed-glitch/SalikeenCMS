name: salik_management_system
description: Salik CRM contact management with role-based gender access and Firebase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/images/
